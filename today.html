<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TODAY — SoccerBoom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0E13;--panel:#12161E;--txt:#F2F4F8;--dim:#7C8594;--red:#E8402A;--hair:#1E2430}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.4}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 90px}
header{padding:26px 0 14px}
h1{font-weight:700;font-size:1.9rem;letter-spacing:-.02em}
h1 .dot{color:var(--red)}
.sub{color:var(--dim);font-size:.85rem;margin-top:4px}
.sub a{color:var(--txt);text-decoration:none;border-bottom:1px solid var(--dim)}
input{width:100%;margin:16px 0 4px;padding:13px 14px;background:var(--panel);border:1px solid var(--hair);border-radius:10px;color:var(--txt);font-family:inherit;font-size:.95rem}
input::placeholder{color:var(--dim)}
.comp{margin-top:22px}
.comp h2{font-size:.78rem;font-weight:500;color:var(--dim);text-transform:uppercase;letter-spacing:.14em;padding-bottom:8px}
.card{background:var(--panel);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.m{display:grid;grid-template-columns:1fr 84px;align-items:center;gap:8px;padding:13px 16px}
.m + .m{border-top:1px solid var(--hair)}
.teams div{font-weight:500;font-size:.96rem;padding:1px 0}
.right{text-align:right}
.score{font-weight:700;font-size:1.25rem;line-height:1.3}
.ko{color:var(--dim);font-weight:500;font-size:.95rem}
.st{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.st.live{color:var(--red)}
.st.predlab{color:var(--dim)}
.st.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:5px;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}}
.win{color:var(--txt)}
.losedim{color:var(--dim)}
.note{color:var(--dim);text-align:center;padding:40px 0}
.err{border:1px solid var(--red);border-radius:10px;padding:14px;margin-top:16px;font-size:.9rem}
.count{color:var(--dim);font-size:.8rem;margin-top:10px}
.lu{border-top:1px solid var(--hair);background:#0E1219;padding:12px 16px}
.lusub{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.lusub.pred{color:var(--red)}
.lugrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.luhead{font-weight:700;font-size:.85rem;margin-bottom:6px}
.lup{font-size:.82rem;color:var(--txt);padding:1px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TODAY<span class="dot">.</span></h1>
    <div class="sub" id="sub">Only matches with a team sheet in hand · <a href="/">SoccerBoom</a> · <a href="/international.html">Internationals</a></div>
  </header>
  <input id="q" type="text" placeholder="Filter — team, league or country" autocomplete="off">
  <div class="count" id="count"></div>
  <div id="list"><div class="note">Loading today's football…</div></div>
</div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let data=[],timer=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function load(){
  clearTimeout(timer);
  try{
    const r=await fetch('/api/today');const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Error '+r.status);
    data=j.fixtures;
    render();
    if(data.some(m=>m.status==='live'))timer=setTimeout(load,120000);
  }catch(e){$('list').innerHTML=`<div class="err">${esc(e.message)}</div>`;}
}

$('q').oninput=render;
function render(){
  const q=$('q').value.trim().toLowerCase();
  const rows=data.filter(m=>!q||(m.home+' '+m.away+' '+m.competition).toLowerCase().includes(q));
  $('count').textContent=rows.length+' matches with team sheets \u00b7 '+new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  if(!rows.length){$('list').innerHTML='<div class="note">No fixtures with lineups right now. Team sheets land ~1h before kickoff; predicted XIs a few hours out. Check back closer to the evening games.</div>';return;}
  const groups={};
  rows.forEach(m=>(groups[m.competition]=groups[m.competition]||[]).push(m));
  $('list').innerHTML=Object.keys(groups).sort().map(k=>{
    const ms=groups[k];
    return `<div class="comp"><h2>${esc(k)}</h2><div class="card">${ms.map(m=>{
      const live=m.status==='live',fin=m.status==='finished';
      const ko=new Date(m.kickoff).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      const right=m.score
        ?`<div class="right"><div class="score">${m.score}</div><div class="st${live?' live':''}">${live?(m.minute?m.minute+"'":'LIVE'):'FT'}</div></div>`
        :`<div class="right"><div class="ko">${ko}</div><div class="st${m.lineup.confirmed?'':' predlab'}">${m.lineup.confirmed?'XI CONFIRMED':'PREDICTED XI'}</div></div>`;
      return `<div class="m" data-id="${m.id}"><div class="teams"><div class="win">${esc(m.home)}</div><div class="win">${esc(m.away)}</div></div>${right}</div><div class="lu" id="lu${m.id}" hidden></div>`;
    }).join('')}</div></div>`;
  }).join('');
  document.querySelectorAll('.m[data-id]').forEach(el=>el.onclick=()=>toggle(el.dataset.id));
}

function toggle(id){
  const box=$('lu'+id);
  if(!box.hidden){box.hidden=true;return;}
  document.querySelectorAll('.lu').forEach(x=>x.hidden=true);
  const m=data.find(x=>x.id===id);
  const side=s=>`<div class="luside"><div class="luhead">${esc(s.name)}${s.formation?' \u00b7 '+esc(s.formation):''}</div>${s.xi.map(p=>`<div class="lup">${p.n!=null?p.n+' ':''}${esc(p.name)}</div>`).join('')}</div>`;
  const label=m.lineup.type==='predicted'?'PREDICTED XI \u2014 team sheet not announced yet':m.lineup.confirmed?'CONFIRMED TEAM SHEET':'TEAM SHEET';
  box.innerHTML=`<div class="lusub ${m.lineup.type==='predicted'?'pred':''}">${label}</div><div class="lugrid">${side(m.lineup.home)}${side(m.lineup.away)}</div>`;
  box.hidden=false;
}
load();
</script>
</body>
</html>
