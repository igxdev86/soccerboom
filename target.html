<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TARGET — tell us what you want to win</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800;900&family=Barlow:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f0c;--panel:#141b16;--panel2:#1c2520;--line:#2a3730;--fg:#f1f5ee;--muted:#8d9b90;--acc:#b6ff3b;--ink:#0c1500;--low:#3ddc84;--mid:#ffc43d;--high:#ff4d5e;
--d:"Barlow Condensed",Impact,sans-serif;--b:"Barlow",Arial,sans-serif;--m:"JetBrains Mono",monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--b)}
.wrap{max-width:480px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;height:56px}
.logo{font-family:var(--d);font-weight:900;font-size:26px;letter-spacing:.04em;color:var(--acc)}.logo span{color:var(--fg)}
.src{font-family:var(--m);font-size:11px;color:var(--muted)}.src.live{color:var(--low)}
h1{font-family:var(--d);font-weight:900;font-size:40px;line-height:.95;margin:10px 0 18px;text-transform:uppercase}
h1 em{font-style:normal;color:var(--acc)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.field{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.field label{font-weight:600;font-size:15px;color:var(--muted)}
.amt{display:flex;align-items:baseline;gap:2px}
.amt b{font-family:var(--d);font-size:28px;color:var(--muted)}
.amt input{width:120px;background:none;border:0;color:var(--fg);font-family:var(--d);font-weight:900;font-size:40px;text-align:right;outline:none;padding:0}
.chips{display:flex;gap:6px;padding:0 16px 14px;border-bottom:1px solid var(--line)}
.chips button{flex:1;background:var(--panel2);border:0;color:var(--fg);border-radius:10px;padding:9px 0;font:600 14px var(--b)}
.chips button.on{background:var(--acc);color:var(--ink)}
.odds{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:14px;color:var(--muted)}
.odds b{font-family:var(--m);color:var(--fg);font-size:15px}
.risk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.risk button{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px 10px;color:var(--fg);text-align:left;font-family:var(--b)}
.risk strong{display:block;font-family:var(--d);font-size:22px;letter-spacing:.03em;text-transform:uppercase}
.risk small{display:block;color:var(--muted);font-size:12px;line-height:1.3;margin-top:3px}
.risk [data-r=low] strong{color:var(--low)}.risk [data-r=mid] strong{color:var(--mid)}.risk [data-r=high] strong{color:var(--high)}
.risk [data-r=low].on{border-color:var(--low)}.risk [data-r=mid].on{border-color:var(--mid)}.risk [data-r=high].on{border-color:var(--high)}
.go{width:100%;background:var(--acc);color:var(--ink);border:0;border-radius:16px;padding:18px;font-family:var(--d);font-weight:900;font-size:26px;letter-spacing:.05em;text-transform:uppercase}
.go:disabled{opacity:.4}
/* slip */
#slip{display:none;margin-top:14px}
#slip.show{display:block}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh h2{font-family:var(--d);font-size:24px;margin:0;text-transform:uppercase}
.sh span{font-family:var(--m);font-size:11px;color:var(--muted)}
.leg{display:flex;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.leg .c{font-family:var(--m);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.leg .t{font-weight:600;font-size:14px;margin:2px 0}
.leg .p{color:var(--acc);font-weight:700;font-size:16px}
.leg .o{font-family:var(--m);font-weight:600;font-size:16px;text-align:right;white-space:nowrap}
.leg .o small{display:block;font-size:11px;color:var(--muted)}
.tot{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:14px 8px}
.tot small{display:block;font-family:var(--m);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tot b{font-family:var(--d);font-size:30px}
.tot .r b{color:var(--acc)}
.acts{display:flex;gap:8px;padding:0 16px 16px}
.acts button{flex:1;border-radius:12px;padding:13px;font:700 15px var(--b);border:1px solid var(--line);background:var(--panel2);color:var(--fg)}
.acts .place{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.err{padding:16px;color:var(--high);font-size:14px;line-height:1.4}
.reset{display:block;width:100%;margin-top:14px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:12px;padding:12px;font:600 14px var(--b)}
footer{color:var(--muted);font-size:11px;text-align:center;padding-top:24px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">TARGET<span>.bet</span></div><div style="display:flex;gap:12px;align-items:center"><a href="/target-feed.html" style="color:var(--muted);font:600 11px var(--m);text-decoration:none">FEED</a><div class="src" id="src">loading prices…</div></div></header>
<h1>Tell us what<br>you want to <em>win</em>.</h1>

<div class="panel">
  <div class="field"><label>I want to win</label><div class="amt"><b>£</b><input id="win" type="number" inputmode="decimal" value="10"></div></div>
  <div class="chips"><button data-w="10">£10</button><button data-w="50">£50</button><button data-w="100">£100</button><button data-w="500">£500</button><button data-w="1000">£1k</button></div>
  <div class="field"><label>Stake</label><div class="amt"><b>£</b><input id="stake" type="number" inputmode="decimal" value="1" step="0.5"></div></div>
  <div class="odds"><span>Odds needed</span><b id="need">9/1 (10.00)</b></div>
</div>

<div class="risk">
  <button data-r="low" class="on"><strong>Low</strong><small>Acca of short favourites</small></button>
  <button data-r="mid"><strong>Medium</strong><small>3–5 legs, evens to 3/1</small></button>
  <button data-r="high"><strong>High</strong><small>One or two picks</small></button>
</div>

<button class="go" id="build" disabled>Build my bet</button>

<div class="panel" id="slip">
  <div class="sh"><h2 id="st">Your bet</h2><span id="sr"></span></div>
  <div id="legs"></div>
  <div class="tot"><div><small>Legs</small><b id="tl">0</b></div><div><small>Odds</small><b id="to">0</b></div><div class="r"><small>Returns</small><b id="tr">£0</b></div></div>
  <div class="acts"><button id="again">Build another</button><button class="place" id="place">Place bet</button></div>
</div>

<button class="reset" id="reset">Reset</button>
<footer>Concept. Bet365 prices via TheStatsAPI. 18+ · BeGambleAware.org</footer>
</div>

<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let POOL=[], risk="low";
const DEF={win:"10",stake:"1",risk:"low"};

async function load(){
  try{ const j=await (await fetch("/api/pool?days=3")).json(); if(!j.pool||!j.pool.length) throw 0;
    POOL=j.pool; $("#src").textContent=j.matches+" fixtures live"; $("#src").classList.add("live"); $("#build").disabled=false;
  }catch(e){ $("#src").textContent="prices unavailable"; }
}
const need=()=>Math.max(1.01,(+$("#win").value||0)/(+$("#stake").value||1));
function frac(d){const x=d-1;let bn=Math.round(x),bd=1,e=9;for(let den=1;den<=20;den++){const n=Math.round(x*den),er=Math.abs(n/den-x);if(er<e-1e-9){e=er;bn=n;bd=den}}const g=(a,b)=>b?g(b,a%b):a;const k=g(bn,bd)||1;return bn/k+"/"+bd/k}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const one=l=>{const s=new Set();return l.filter(x=>!s.has(x.match)&&s.add(x.match))};
const greedy=(c,R)=>{let p=1,o=[];for(const s of c){if(p>=R)break;o.push(s);p*=s.price}return p>=R?o:[]};

function build(){
  const R=need(); let legs=[];
  if(risk==="low") legs=greedy(one(shuffle(POOL.filter(s=>s.price>=1.04&&s.price<=1.5))).sort((a,b)=>a.price-b.price),R);
  else if(risk==="mid") legs=greedy(one(shuffle(POOL.filter(s=>s.price>=1.7&&s.price<=4.2))),R);
  else{
    const c=one(shuffle(POOL.filter(s=>s.price>=1.8)));
    const single=c.filter(s=>s.price>=R&&s.price<=R*1.5).sort((a,b)=>a.price-b.price)[0];
    if(single) legs=[single];
    else{ let best=null,bp=1e9;
      for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++){if(c[i].match===c[j].match)continue;const p=c[i].price*c[j].price;if(p>=R&&p<bp){bp=p;best=[c[i],c[j]]}}
      if(!best)for(let i=0;i<c.length;i++)for(let j=i+1;j<c.length;j++)for(let k=j+1;k<c.length;k++){if(new Set([c[i].match,c[j].match,c[k].match]).size<3)continue;const p=c[i].price*c[j].price*c[k].price;if(p>=R&&p<bp){bp=p;best=[c[i],c[j],c[k]]}}
      if(best)legs=best; }
  }
  render(legs);
}
async function loadCopy(){
  const id=new URLSearchParams(location.search).get("copy"); if(!id) return;
  const b=await (await fetch("/api/target-bet?id="+id)).json(); if(!b||b.error) return;
  $("#win").value=b.target; $("#stake").value=b.stake; risk=b.risk;
  $$(".risk button").forEach(x=>x.classList.toggle("on",x.dataset.r===risk)); sync();
  render(b.legs.map(l=>({...l,result:undefined})), `Copied from ${b.user}`);
}
function render(legs,label){
  const stake=+$("#stake").value||0; $("#slip").classList.add("show");
  $("#sr").textContent=label||{low:"Low risk",mid:"Medium risk",high:"High risk"}[risk];
  if(!legs.length){$("#legs").innerHTML='<div class="err">Can\'t hit that target at this risk with today\'s prices. Lower the target, raise the stake or go higher risk.</div>';$("#tl").textContent=$("#to").textContent=$("#tr").textContent="–";$("#st").textContent="No bet";return}
  legs.sort((a,b)=>a.ko<b.ko?-1:1);
  const odds=legs.reduce((p,l)=>p*l.price,1);
  $("#legs").innerHTML=legs.map(l=>`<a class="leg" href="/target-event.html?m=${l.match}" style="color:inherit;text-decoration:none"><div><div class="c">${l.comp||""} · ${l.market}</div><div class="t">${l.home} v ${l.away}</div><div class="p">${l.pick}</div></div><div class="o">${l.price.toFixed(2)}<small>${frac(l.price)} · ${new Date(l.ko).toLocaleString("en-GB",{weekday:"short",hour:"2-digit",minute:"2-digit"})}</small></div></a>`).join("");
  $("#tl").textContent=legs.length;$("#to").textContent=odds.toFixed(2);$("#tr").textContent="£"+(stake*odds).toFixed(2);
  $("#st").textContent=legs.length===1?"Single":legs.length===2?"Double":legs.length===3?"Treble":legs.length+"-fold";
  $("#slip").scrollIntoView({behavior:"smooth",block:"start"});
}
function sync(){const R=need();$("#need").textContent=frac(R)+" ("+R.toFixed(2)+")";$$(".chips button").forEach(c=>c.classList.toggle("on",c.dataset.w===$("#win").value))}
function reset(){
  $("#win").value=DEF.win;$("#stake").value=DEF.stake;risk=DEF.risk;
  $$(".risk button").forEach(b=>b.classList.toggle("on",b.dataset.r===risk));
  $("#slip").classList.remove("show");$("#legs").innerHTML="";$("#tl").textContent=$("#to").textContent=$("#tr").textContent="";
  sync();window.scrollTo({top:0,behavior:"smooth"});
}
$("#win").oninput=$("#stake").oninput=sync;
$$(".chips button").forEach(c=>c.onclick=()=>{$("#win").value=c.dataset.w;sync()});
$$(".risk button").forEach(b=>b.onclick=()=>{$$(".risk button").forEach(x=>x.classList.remove("on"));b.classList.add("on");risk=b.dataset.r;if($("#slip").classList.contains("show"))build()});
$("#build").onclick=build;$("#again").onclick=build;$("#reset").onclick=reset;
$("#place").onclick=()=>alert("Concept only — would hand the slip to the sportsbook pre-filled.");
sync();load();loadCopy();
</script>
</body>
</html>
