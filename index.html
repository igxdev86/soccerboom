<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoccerBoom — live scores & team analysis</title>
<meta name="description" content="Football scores, match stats, xG and team scoreline analysis across 150+ competitions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAFBF8;
  --ink:#14201A;
  --ink-soft:#4A5A50;
  --pitch:#0E7A3C;
  --pitch-deep:#0A5C2D;
  --bulb:#FFD400;
  --line:#DCE3DC;
  --loss:#C0392B;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Barlow',system-ui,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 80px}

header{padding:18px 0 10px;border-bottom:3px solid var(--ink)}
.brand{font-family:'Barlow Condensed';font-weight:800;font-size:2.1rem;letter-spacing:.01em;line-height:1}
.brand em{font-style:normal;color:var(--pitch)}
.tag{color:var(--ink-soft);font-size:.85rem;margin-top:2px}

nav{display:flex;gap:0;margin:14px 0 0;border:2px solid var(--ink)}
nav button{flex:1;padding:10px 0;background:none;border:none;font-family:'Barlow Condensed';font-weight:800;font-size:1.15rem;color:var(--ink);cursor:pointer;letter-spacing:.02em}
nav button.on{background:var(--ink);color:var(--paper)}
nav button + button{border-left:2px solid var(--ink)}

.bar{display:flex;gap:8px;align-items:center;margin:14px 0}
select,input[type=text]{font-family:'Barlow';font-size:.95rem;padding:9px 10px;border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:0;width:100%}
.datenav{display:flex;align-items:center;gap:6px}
.datenav button{border:2px solid var(--ink);background:#fff;width:38px;height:38px;font-size:1.1rem;font-weight:700;cursor:pointer;flex:none}
.datenav .day{font-family:'Barlow Condensed';font-weight:800;font-size:1.15rem;flex:1;text-align:center;white-space:nowrap}

.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.match:active{background:#F0F4EE}
.team{font-weight:500;font-size:.98rem}
.team.h{text-align:right}
.team.win{font-weight:700}
.score{font-family:'Barlow Condensed';font-weight:800;font-size:1.7rem;min-width:74px;text-align:center;line-height:1;padding:4px 6px;background:var(--ink);color:var(--paper)}
.score.sched{background:none;color:var(--ink-soft);font-size:1.05rem;font-weight:600}
.score.live{background:var(--bulb);color:var(--ink)}
.mstate{grid-column:1/-1;text-align:center;font-size:.72rem;color:var(--ink-soft);margin-top:-4px}
.mstate .livedot{color:var(--pitch);font-weight:700}

.note{padding:26px 8px;color:var(--ink-soft);text-align:center;font-size:.95rem}
.note b{color:var(--ink)}
.err{border:2px solid var(--loss);padding:12px;margin:14px 0;font-size:.92rem}
.spin{padding:32px;text-align:center;color:var(--ink-soft)}

/* modal */
#modal{position:fixed;inset:0;background:rgba(20,32,26,.55);display:none;z-index:20;overflow-y:auto;padding:24px 10px}
#modal.open{display:block}
.sheet{background:var(--paper);max-width:560px;margin:0 auto;border:3px solid var(--ink)}
.sheet-head{padding:16px;border-bottom:2px solid var(--ink);position:relative}
.sheet-close{position:absolute;top:8px;right:8px;border:2px solid var(--ink);background:#fff;width:34px;height:34px;font-size:1.05rem;font-weight:700;cursor:pointer}
.bigscore{font-family:'Barlow Condensed';font-weight:800;font-size:3rem;text-align:center;line-height:1;margin:6px 0 2px}
.sheet-meta{text-align:center;color:var(--ink-soft);font-size:.85rem}
.sheet-teams{display:flex;justify-content:space-between;font-family:'Barlow Condensed';font-weight:600;font-size:1.25rem;gap:12px}
.statrow{padding:10px 16px;border-bottom:1px solid var(--line)}
.statrow .nums{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem}
.statrow .lbl{text-align:center;font-size:.78rem;color:var(--ink-soft);margin:1px 0 5px}
.statbar{display:flex;height:7px;gap:2px}
.statbar i{display:block;background:var(--pitch)}
.statbar i.a{background:var(--ink)}

/* analysis */
.results{border:2px solid var(--ink);margin-top:8px;background:#fff;max-height:230px;overflow-y:auto}
.results button{display:block;width:100%;text-align:left;padding:10px 12px;background:none;border:none;border-bottom:1px solid var(--line);font-size:.95rem;cursor:pointer}
.results button:active{background:#F0F4EE}
.results .c{color:var(--ink-soft);font-size:.8rem}
.summary{margin:18px 0 6px;border:3px solid var(--ink)}
.summary .top{background:var(--ink);color:var(--paper);padding:12px 14px;font-family:'Barlow Condensed';font-weight:800;font-size:1.35rem}
.kpis{display:grid;grid-template-columns:repeat(3,1fr)}
.kpi{padding:12px 8px;text-align:center;border-right:1px solid var(--line)}
.kpi:last-child{border-right:none}
.kpi b{display:block;font-family:'Barlow Condensed';font-weight:800;font-size:1.7rem;line-height:1.1}
.kpi span{font-size:.74rem;color:var(--ink-soft)}
.headline{padding:14px;border-top:2px solid var(--ink);font-size:.98rem}
.headline b{font-family:'Barlow Condensed';font-size:1.5rem;font-weight:800;color:var(--pitch);padding:0 3px}
table{width:100%;border-collapse:collapse;margin-top:14px;font-size:.92rem}
th{font-family:'Barlow Condensed';font-weight:800;font-size:1rem;text-align:left;border-bottom:2px solid var(--ink);padding:6px 8px}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.freqbar{height:6px;background:var(--pitch);min-width:2px}
.small{font-size:.8rem;color:var(--ink-soft);margin-top:10px}
.gobtn{width:100%;margin-top:10px;padding:12px;border:none;background:var(--pitch);color:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:1.2rem;cursor:pointer;letter-spacing:.02em}
.gobtn:disabled{background:var(--line);color:var(--ink-soft)}
.gridlbl{font-size:.85rem;color:var(--ink-soft);margin:4px 0 8px}
.scoregrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scoregrid button{padding:11px 0;border:2px solid var(--ink);background:#fff;font-family:'Barlow Condensed';font-weight:800;font-size:1.15rem;cursor:pointer;color:var(--ink)}
.scoregrid button.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
tr.teamrow{cursor:pointer}
.sub{font-size:.72rem;color:var(--ink-soft);font-weight:400}
tr.teamrow td:first-child{font-weight:500}
tr.hit td:first-child::after{content:" ●";color:var(--pitch)}
tr.expand td{background:#F0F4EE;font-size:.86rem;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){
  .score.live{animation:bulb 1.6s ease-in-out infinite}
  @keyframes bulb{50%{opacity:.72}}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">SOCCER<em>BOOM</em></div>
    <div class="tag">Scores, stats &amp; scoreline analysis</div>
    <nav>
      <button id="tabScores" class="on">Scores</button>
      <button id="tabAnalysis">Team analysis</button>
    </nav>
  </header>

  <section id="viewScores">
    <div class="bar"><select id="compSel"></select></div>
    <div class="bar datenav">
      <button id="dPrev" aria-label="Previous day">‹</button>
      <div class="day" id="dLabel"></div>
      <button id="dNext" aria-label="Next day">›</button>
    </div>
    <div id="matchList"><div class="spin">Loading…</div></div>
  </section>

  <section id="viewAnalysis" hidden>
    <div class="gridlbl">Tap a score (goals for – goals against). Every team, every league.</div>
    <div class="scoregrid" id="scoreGrid"></div>
    <div class="bar" style="margin-top:12px">
      <select id="minSel">
        <option value="10">Min 10 matches</option>
        <option value="20" selected>Min 20 matches</option>
        <option value="40">Min 40 matches</option>
      </select>
      <select id="countrySel"><option value="">All countries</option></select>
    </div>
    <button class="gobtn" id="runBtn" disabled>Pick a score first</button>
    <div id="analysisOut"></div>
  </section>
</div>

<div id="modal"><div class="sheet" id="sheetBody"></div></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const API=(path,long)=>fetch('/api/tsa?path='+encodeURIComponent(path)+(long?'&cache=long':''))
  .then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('API error '+r.status));return j;});

/* ---------- tabs ---------- */
$('tabScores').onclick=()=>{setTab('Scores')};
$('tabAnalysis').onclick=()=>{setTab('Analysis')};
function setTab(t){
  $('viewScores').hidden=t!=='Scores';
  $('viewAnalysis').hidden=t!=='Analysis';
  $('tabScores').classList.toggle('on',t==='Scores');
  $('tabAnalysis').classList.toggle('on',t==='Analysis');
}

/* ---------- competitions ---------- */
let compId=localStorage.getItem('sb_comp')||'';
async function loadComps(){
  let comps;
  const cached=JSON.parse(localStorage.getItem('sb_comps')||'null');
  if(cached&&Date.now()-cached.at<864e5){comps=cached.data;}
  else{
    const out=[];let page=1;
    while(page<=3){ // up to 300 comps
      const r=await API(`/football/competitions?per_page=100&page=${page}`,true);
      out.push(...r.data);
      if(page>=r.meta.total_pages)break;page++;
    }
    comps=out;localStorage.setItem('sb_comps',JSON.stringify({at:Date.now(),data:out}));
  }
  comps.sort((a,b)=>(a.country||'zz').localeCompare(b.country||'zz')||a.name.localeCompare(b.name));
  const sel=$('compSel');sel.innerHTML='';
  comps.forEach(c=>{
    const o=document.createElement('option');
    o.value=c.id;o.textContent=(c.country?c.country+' — ':'')+c.name;
    sel.appendChild(o);
  });
  if(!compId){
    const pl=comps.find(c=>c.name==='Premier League'&&c.country==='England');
    compId=pl?pl.id:comps[0].id;
  }
  sel.value=compId;
  sel.onchange=()=>{compId=sel.value;localStorage.setItem('sb_comp',compId);loadMatches();};
}

/* ---------- date nav ---------- */
let day=new Date();
const fmt=d=>d.toISOString().slice(0,10);
function dayLabel(){
  const today=fmt(new Date());
  const s=fmt(day);
  const nice=day.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  $('dLabel').textContent=s===today?'Today, '+nice:nice;
}
$('dPrev').onclick=()=>{day.setDate(day.getDate()-1);loadMatches();};
$('dNext').onclick=()=>{day.setDate(day.getDate()+1);loadMatches();};

/* ---------- scores ---------- */
let pollTimer=null;
async function loadMatches(){
  dayLabel();
  clearTimeout(pollTimer);
  const el=$('matchList');el.innerHTML='<div class="spin">Loading…</div>';
  const d=fmt(day);
  try{
    const past=d<fmt(new Date());
    const r=await API(`/football/matches?competition_id=${compId}&date_from=${d}&date_to=${d}&per_page=100`,past);
    if(!r.data.length){el.innerHTML='<div class="note">No matches in this competition on this day.<br>Try another day or competition.</div>';return;}
    r.data.sort((a,b)=>a.utc_date.localeCompare(b.utc_date));
    el.innerHTML='';
    let anyLive=false;
    r.data.forEach(m=>{
      const fin=m.status==='finished',live=m.status==='live';
      if(live)anyLive=true;
      const hs=m.score.home,as=m.score.away;
      const row=document.createElement('div');row.className='match';
      const hw=fin&&hs>as, aw=fin&&as>hs;
      const ko=new Date(m.utc_date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      row.innerHTML=
        `<div class="team h${hw?' win':''}">${esc(m.home_team.name)}</div>`+
        (fin||live
          ?`<div class="score${live?' live':''}">${hs} – ${as}</div>`
          :`<div class="score sched">${m.status==='scheduled'?ko:m.status}</div>`)+
        `<div class="team${aw?' win':''}">${esc(m.away_team.name)}</div>`+
        `<div class="mstate">${live?'<span class="livedot">● LIVE</span>':fin?'Full time':''}</div>`;
      row.onclick=()=>openMatch(m);
      el.appendChild(row);
    });
    if(anyLive)pollTimer=setTimeout(loadMatches,60000);
  }catch(e){el.innerHTML=`<div class="err">${esc(e.message)}</div>`;}
}

/* ---------- match detail ---------- */
async function openMatch(m){
  const modal=$('modal'),sheet=$('sheetBody');
  modal.classList.add('open');
  const fin=m.status==='finished',live=m.status==='live';
  const scoreTxt=(fin||live)?`${m.score.home} – ${m.score.away}`:new Date(m.utc_date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  sheet.innerHTML=`<div class="sheet-head">
    <button class="sheet-close" onclick="document.getElementById('modal').classList.remove('open')">✕</button>
    <div class="sheet-teams"><span>${esc(m.home_team.name)}</span><span>${esc(m.away_team.name)}</span></div>
    <div class="bigscore">${scoreTxt}</div>
    <div class="sheet-meta" id="sheetMeta">${live?'Live':fin?'Full time':new Date(m.utc_date).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}</div>
  </div><div id="sheetStats"><div class="spin">Loading stats…</div></div>`;
  modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open');};
  try{
    const det=await API(`/football/matches/${m.id}`,fin);
    const s=det.data.score||{};
    const meta=[];
    if(s.half_time_home!=null)meta.push(`HT ${s.half_time_home}–${s.half_time_away}`);
    if(det.data.venue)meta.push(esc(det.data.venue.name));
    if(det.data.referee)meta.push('Ref: '+esc(det.data.referee.name));
    if(meta.length)$('sheetMeta').innerHTML+= '<br>'+meta.join(' · ');
  }catch(e){}
  if(!fin&&!live){$('sheetStats').innerHTML='<div class="note">Stats appear once the match kicks off.</div>';return;}
  try{
    const r=await API(`/football/matches/${m.id}${live?'/live-stats':'/stats'}`,fin);
    const src=live?r.data.stats:(r.data.overview||{});
    const npx=!live&&r.data.np_expected_goals?{np_expected_goals:r.data.np_expected_goals}:{};
    const rows=[
      ['ball_possession','Possession %'],['expected_goals','Expected goals (xG)'],
      ['np_expected_goals','Non-penalty xG'],['total_shots','Shots'],
      ['shots_on_target','On target'],['big_chances','Big chances'],
      ['corner_kicks','Corners'],['fouls','Fouls'],
      ['yellow_cards','Yellow cards'],['red_cards','Red cards']
    ];
    let html='';
    rows.forEach(([k,lbl])=>{
      const item=src[k]||npx[k];
      const v=item&&item.all;
      if(!v||v.home==null)return;
      const h=+v.home,a=+v.away,tot=h+a||1;
      html+=`<div class="statrow">
        <div class="nums"><span>${h}</span><span>${a}</span></div>
        <div class="lbl">${lbl}</div>
        <div class="statbar"><i style="width:${(h/tot*100).toFixed(1)}%"></i><i class="a" style="width:${(a/tot*100).toFixed(1)}%"></i></div>
      </div>`;
    });
    $('sheetStats').innerHTML=html||'<div class="note">No detailed stats for this match.</div>';
  }catch(e){$('sheetStats').innerHTML=`<div class="err">${esc(e.message)}</div>`;}
}

/* ---------- score-first analysis (all leagues, via Supabase) ---------- */
let pickedScore=null,lastRows=[];
(function buildGrid(){
  const g=$('scoreGrid');
  for(let gf=0;gf<=4;gf++)for(let ga=0;ga<=4;ga++){
    const b=document.createElement('button');
    b.textContent=gf+'\u2013'+ga;
    b.onclick=()=>{
      pickedScore=[gf,ga];
      [...g.children].forEach(x=>x.classList.remove('on'));
      b.classList.add('on');
      $('runBtn').disabled=false;
      $('runBtn').textContent='Find teams that go '+gf+'\u2013'+ga;
    };
    g.appendChild(b);
  }
})();
$('runBtn').onclick=runAnalysis;
$('minSel').onchange=()=>{if(pickedScore)runAnalysis();};
$('countrySel').onchange=renderRows;

async function runAnalysis(){
  const [GF,GA]=pickedScore,min=$('minSel').value;
  const out=$('analysisOut');
  out.innerHTML='<div class="spin">Ranking every team\u2026</div>';
  try{
    const r=await fetch(`/api/score?gf=${GF}&ga=${GA}&min=${min}`);
    const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Error '+r.status);
    lastRows=j.data||[];
    if(!lastRows.length){
      out.innerHTML=`<div class="note">No teams yet.${j.meta&&j.meta.phase==='backfill'?' Data is still syncing ('+(j.meta.matches||0)+' matches so far) \u2014 run the backfill from /admin.html.':' Lower the minimum matches filter.'}</div>`;return;
    }
    const countries=[...new Set(lastRows.map(x=>x.country).filter(Boolean))].sort();
    const cs=$('countrySel'),keep=cs.value;
    cs.innerHTML='<option value="">All countries</option>'+countries.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
    cs.value=countries.includes(keep)?keep:'';
    window._meta=j.meta;
    renderRows();
  }catch(e){out.innerHTML=`<div class="err">${esc(e.message)}</div>`;}
}

function renderRows(){
  if(!pickedScore||!lastRows.length)return;
  const [GF,GA]=pickedScore,key=GF+'-'+GA,c=$('countrySel').value;
  const rows=c?lastRows.filter(x=>x.country===c):lastRows;
  const meta=window._meta||{};
  const synced=meta.last_run?new Date(meta.last_run).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):'';
  $('analysisOut').innerHTML=`
    <div class="summary">
      <div class="top">Who goes ${GF}\u2013${GA}?</div>
      <div class="headline">${rows.length} teams ranked by how often they finish exactly ${GF}\u2013${GA}. \u25cf marks teams whose most common score IS ${GF}\u2013${GA}. Tap a team for their full breakdown.</div>
    </div>
    <table>
      <thead><tr><th>Team</th><th class="n">${GF}\u2013${GA}s</th><th class="n">%</th><th class="n">Usual</th></tr></thead>
      <tbody>${rows.map((t,i)=>`<tr class="teamrow${t.modal_score===key?' hit':''}" data-i="${i}"><td>${esc(t.team_name)}<div class="sub">${esc(t.country||'')}${t.competition?' \u00b7 '+esc(t.competition):''}</div></td><td class="n">${t.hits}<div class="sub">of ${t.games}</div></td><td class="n">${t.pct}%</td><td class="n">${esc(t.modal_score||'')}</td></tr>`).join('')}</tbody>
    </table>
    <div class="small">${meta.matches?meta.matches.toLocaleString()+' matches in the database':''}${synced?' \u00b7 synced '+synced:''}${meta.phase==='backfill'?' \u00b7 backfill still running, more leagues arriving':''}. 90-minute scores, all venues, from each team's perspective.</div>`;
  const filtered=rows;
  $('analysisOut').querySelectorAll('tr.teamrow').forEach(tr=>tr.onclick=()=>expandTeam(tr,filtered[+tr.dataset.i]));
}

function expandTeam(tr,t){
  const open=tr.nextElementSibling&&tr.nextElementSibling.classList.contains('expand');
  document.querySelectorAll('tr.expand').forEach(x=>x.remove());
  if(open)return;
  const ex=document.createElement('tr');ex.className='expand';
  ex.innerHTML=`<td colspan="4"><b>${esc(t.team_name)}</b>: ${t.wins}-${t.draws}-${t.losses} in ${t.games} \u00b7 ${t.gf_avg} for / ${t.ga_avg} against per game${t.wins?` \u00b7 avg winning score ${t.win_gf_avg}\u2013${t.win_ga_avg}`:''}<br>Top scores: ${esc(t.top_scores||'')}</td>`;
  tr.after(ex);
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- boot ---------- */
(async()=>{
  try{await loadComps();await loadMatches();}
  catch(e){$('matchList').innerHTML=`<div class="err">${esc(e.message)}<br><br>If this says the key is not set, add THESTATSAPI_KEY in Vercel → Settings → Environment Variables, then redeploy.</div>`;}
})();
</script>
</body>
</html>
