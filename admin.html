<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoccerBoom sync</title>
<style>
body{font-family:system-ui,sans-serif;max-width:520px;margin:0 auto;padding:20px;color:#14201A;background:#FAFBF8}
h1{font-size:1.4rem}input,button{font-size:1rem;padding:11px;width:100%;box-sizing:border-box;border:2px solid #14201A;border-radius:0;margin-top:8px}
button{background:#0E7A3C;color:#fff;border-color:#0E7A3C;font-weight:700;cursor:pointer}
button.stop{background:#C0392B;border-color:#C0392B}
pre{background:#fff;border:2px solid #14201A;padding:12px;white-space:pre-wrap;font-size:.85rem;min-height:120px}
</style></head><body>
<h1>SoccerBoom data sync</h1>
<p>Runs the backfill in batches until every league is loaded. Keep this tab open; it resumes automatically if the API rate-limits.</p>
<input id="secret" type="password" placeholder="SYNC_SECRET">
<button id="go">Start backfill</button>
<pre id="log">Idle.</pre>
<script>
let running=false,timer=null;
const log=$=>document.getElementById('log').textContent=$;
document.getElementById('go').onclick=()=>{
  if(running){running=false;clearTimeout(timer);document.getElementById('go').textContent='Start backfill';document.getElementById('go').classList.remove('stop');return;}
  running=true;document.getElementById('go').textContent='Stop';document.getElementById('go').classList.add('stop');
  tick();
};
async function tick(){
  if(!running)return;
  try{
    const r=await fetch('/api/sync?secret='+encodeURIComponent(document.getElementById('secret').value));
    const j=await r.json();
    log(JSON.stringify(j,null,2));
    if(j.error||j.phase==='daily'){running=false;document.getElementById('go').textContent='Start backfill';document.getElementById('go').classList.remove('stop');return;}
    const wait=/rate limit/i.test(j.note||'')?65000:2000;
    timer=setTimeout(tick,wait);
  }catch(e){log('Network error, retrying in 10s…');timer=setTimeout(tick,10000);}
}
</script></body></html>
